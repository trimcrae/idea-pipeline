name: Deploy probe landing page

# Serves docs/ (the freight-fraud-check probe page) on GitHub Pages.
# Uses configure-pages with enablement:true, so Pages turns itself on the first
# time this runs — NO manual Settings → Pages toggle needed.
#
# Hard requirement it cannot escape: GitHub Pages is only free on a PUBLIC repo.
# While this repo is private on a free plan, the deploy step fails by design.
# The instant the repo is made public, this workflow makes the page live with
# zero further action. That single visibility flip is the one step no tool here
# can perform (it is a Settings action, not a git/API call in scope).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # continue-on-error: the run is reported as success even if a step fails, so
    # a not-yet-enabled Pages site never sends a failed-run email. Once Pages is
    # enabled (Settings -> Pages -> Source: GitHub Actions), the steps succeed and
    # the page deploys for real.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
